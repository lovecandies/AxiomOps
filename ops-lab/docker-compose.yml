services:
  inventory-service:
    image: axiomops-lab:phase1
    build:
      context: ..
      dockerfile: ops-lab/Dockerfile
    environment:
      AXIOMOPS_LAB_SERVICE_NAME: inventory-service
      AXIOMOPS_LAB_ROLE: inventory
    ports:
      - "18002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15

  order-service:
    image: axiomops-lab:phase1
    pull_policy: never
    environment:
      AXIOMOPS_LAB_SERVICE_NAME: order-service
      AXIOMOPS_LAB_ROLE: order
      AXIOMOPS_LAB_INVENTORY_URL: http://inventory-service:8000
      AXIOMOPS_LAB_DOWNSTREAM_TIMEOUT_SECONDS: "2.0"
    ports:
      - "18001:8000"
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
