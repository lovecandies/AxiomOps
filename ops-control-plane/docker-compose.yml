services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: axiomops
      MYSQL_USER: axiomops
      MYSQL_PASSWORD: axiomops
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uaxiomops", "-paxiomops"]
      interval: 3s
      timeout: 3s
      retries: 30

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports:
      - "19876:9876"

  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on:
      - namesrv

  proxy:
    image: apache/rocketmq:5.3.2
    command: sh mqproxy
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on:
      - namesrv
      - broker
    ports:
      - "18080:8080"
      - "18081:8081"
    restart: unless-stopped

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on:
      - broker
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until sh mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q DefaultCluster; do sleep 2; done;
        sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t axiomops-incidents;
        sh mqadmin updateSubGroup -n namesrv:9876 -c DefaultCluster -g axiomops-investigation-dispatcher

  mysql-migrate:
    image: mysql:8.4
    environment:
      MYSQL_PWD: root
    volumes:
      - ./mysql:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for migration in /migrations/002_evidence.sql /migrations/003_rca.sql /migrations/004_phase5.sql /migrations/005_phase6.sql; do
          mysql -h mysql -u root axiomops < $$migration || exit 1;
        done

  redis:
    image: redis:8.2.7-alpine
    command: redis-server --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "16333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 20

  control-plane:
    image: axiomops-control-plane:phase7
    build:
      context: ..
      dockerfile: ops-control-plane/Dockerfile
    environment: &control-environment
      AXIOMOPS_CONTROL_MYSQL_HOST: mysql
      AXIOMOPS_CONTROL_MYSQL_PORT: "3306"
      AXIOMOPS_CONTROL_MYSQL_DATABASE: axiomops
      AXIOMOPS_CONTROL_MYSQL_USER: axiomops
      AXIOMOPS_CONTROL_MYSQL_PASSWORD: axiomops
      AXIOMOPS_CONTROL_ROCKETMQ_ENDPOINTS: proxy:8081
      AXIOMOPS_CONTROL_ROCKETMQ_TOPIC: axiomops-incidents
      AXIOMOPS_CONTROL_ROCKETMQ_CONSUMER_GROUP: axiomops-investigation-dispatcher
      AXIOMOPS_CONTROL_PROMETHEUS_URL: http://host.docker.internal:19090
      AXIOMOPS_CONTROL_ORDER_SERVICE_URL: http://host.docker.internal:18001
      AXIOMOPS_CONTROL_INVENTORY_SERVICE_URL: http://host.docker.internal:18002
      AXIOMOPS_CONTROL_EVIDENCE_ROOT: /var/lib/axiomops/evidence
      AXIOMOPS_CONTROL_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AXIOMOPS_CONTROL_DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      AXIOMOPS_CONTROL_REDIS_URL: redis://redis:6379
      AXIOMOPS_CONTROL_QDRANT_URL: http://qdrant:6333
    ports:
      - "18000:8000"
    depends_on:
      mysql-migrate:
        condition: service_completed_successfully
      rocketmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - evidence-data:/var/lib/axiomops/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  outbox-relay:
    image: axiomops-control-plane:phase7
    pull_policy: never
    command: python -m axiom_ops.control_plane.relay
    environment: *control-environment
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  investigation-consumer:
    image: axiomops-control-plane:phase7
    pull_policy: never
    command: python -m axiom_ops.control_plane.consumer
    environment: *control-environment
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  evidence-data:
  redis-data:
  qdrant-data:
